[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/git-acquire",
    "crates/analyzer",
    "crates/host-probe",
    "crates/provisioner",
    "crates/sandbox",
    "crates/snapshot",
    "crates/net-tree",
    "crates/gui",
    "crates/mcp",
    "crates/cli",
    "crates/workflow",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Windows port"]

[workspace.dependencies]
winorchestrator-core = { path = "crates/core" }
winorchestrator-git-acquire = { path = "crates/git-acquire" }
winorchestrator-analyzer = { path = "crates/analyzer" }
winorchestrator-host-probe = { path = "crates/host-probe" }
winorchestrator-provisioner = { path = "crates/provisioner" }
winorchestrator-sandbox = { path = "crates/sandbox" }
winorchestrator-snapshot = { path = "crates/snapshot" }
winorchestrator-net-tree = { path = "crates/net-tree" }
winorchestrator-gui = { path = "crates/gui" }
winorchestrator-mcp = { path = "crates/mcp" }
winorchestrator-workflow = { path = "crates/workflow" }

clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
regex = "1"
walkdir = "2"
thiserror = "2"
windows-sys = { version = "0.59", default-features = false }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
